<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Page not found</title>
<link rel="icon" type="image/svg+xml" href="/icons/face.svg">
<script src="/guard.js"></script>
<style>
:root{ --bg:#fff; --ink:#16140f; --muted:#62605a; color-scheme:light }
@media (prefers-color-scheme:dark){ :root{ --bg:#121110; --ink:#f3f1ea; --muted:#a6a297; color-scheme:dark } }
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;text-align:center;padding:0 20px}
h1{font-size:clamp(30px,7vw,48px);line-height:1.05;margin:0}
p{color:var(--muted);margin:12px 0 0}
a{display:inline-block;margin-top:22px;border:1.5px solid #16140f;background:#fdda24;color:#16140f;border-radius:99px;padding:12px 22px;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<div><h1>Belgo can't find that page</h1><p>The address may be mistyped, or the page was moved.</p><a href="/">Go to the website</a></div>
</body>
</html>
