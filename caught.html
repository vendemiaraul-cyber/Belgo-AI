<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Caught by Belgo</title>
<link rel="icon" type="image/svg+xml" href="/icons/face.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Rubik:wght@400;500;600&display=swap">
<style>
/* Layout: one dark screen. Belgo on the left giving the L, the verdict and the cause on the right; stacked on a phone. */
:root{ --bg:#0d0c12; --panel:#191822; --line:#33313f; --ink:#f6f3ea; --muted:#aaa6b6; --yellow:#fdda24; --red:#ef3340; --black:#16140f;
  --display:"Baloo 2","Rubik",system-ui,sans-serif; --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--body);display:grid;place-items:center}
main{width:100%;max-width:900px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:28px 48px;
  padding:32px max(20px,env(safe-area-inset-right,0px)) 32px max(20px,env(safe-area-inset-left,0px))}
.fig{flex:none;width:min(46vw,210px)}
.fig svg{display:block;width:100%;height:auto;overflow:visible}
.say{flex:1 1 320px;min-width:0;max-width:520px}
h1{font:800 clamp(34px,7vw,58px)/1 var(--display);margin:0;color:var(--yellow);text-wrap:balance}
p{margin:14px 0 0}
.cause{margin-top:22px;border:1.5px solid var(--line);background:var(--panel);border-radius:16px;padding:16px 18px}
.cause b{display:block;font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cause span{display:block;margin-top:6px}
.cause code{display:block;margin-top:10px;font:13.5px/1.4 var(--mono);color:var(--yellow);overflow-wrap:anywhere}
.btn{display:inline-block;margin-top:24px;border:1.5px solid var(--yellow);background:var(--yellow);color:#16140f;border-radius:99px;padding:12px 22px;font-weight:600;text-decoration:none}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
small{display:block;margin-top:18px;color:var(--muted);font-size:13.5px}
#arm{transform-origin:98px 71px;animation:tap 1.1s ease-in-out infinite alternate}
#head{transform-origin:60px 54px;animation:tilt 2.2s ease-in-out infinite alternate}
@keyframes tap{to{transform:translateY(-3px)}}
@keyframes tilt{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
@media (prefers-reduced-motion:reduce){#arm,#head{animation:none}}
</style>
</head>
<body>
<main>
  <div class="fig" aria-hidden="true">
    <svg viewBox="-6 -52 152 252">
      <defs>
        <linearGradient id="flag" gradientUnits="userSpaceOnUse" x1="34" y1="0" x2="86" y2="0">
          <stop offset="0" stop-color="#16140f"/><stop offset=".335" stop-color="#16140f"/>
          <stop offset=".335" stop-color="#fdda24"/><stop offset=".665" stop-color="#fdda24"/>
          <stop offset=".665" stop-color="#ef3340"/><stop offset="1" stop-color="#ef3340"/>
        </linearGradient>
        <filter id="edge" x="-20%" y="-20%" width="140%" height="140%">
          <feMorphology in="SourceAlpha" operator="dilate" radius="2.4" result="fat"/>
          <feFlood flood-color="#f6f3ea"/><feComposite in2="fat" operator="in" result="rim"/>
          <feMerge><feMergeNode in="rim"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g filter="url(#edge)">
        <g fill="url(#flag)">
          <rect x="37" y="116" width="22" height="78" rx="10"/>
          <rect x="61" y="116" width="22" height="78" rx="10"/>
          <rect x="12.5" y="62" width="18.5" height="66" rx="9.25" transform="rotate(18 22 71)"/>
          <path d="M34 82a22 22 0 0 1 22-22h8a22 22 0 0 1 22 22v50H34z"/>
          <circle id="head" cx="60" cy="30" r="24"/>
        </g>
        <!-- the raised arm, and the L it makes above his forehead -->
        <g id="arm">
          <rect x="89" y="62" width="18.5" height="66" rx="9.25" fill="#ef3340" transform="rotate(180 98 71)"/>
          <path d="M88 -44h20v38h30v20H88z" fill="#fdda24" stroke="#16140f" stroke-width="3" stroke-linejoin="round"/>
        </g>
      </g>
    </svg>
  </div>
  <div class="say">
    <h1>You tried to hack our website</h1>
    <p>Belgo saw it, and he is giving you the L.</p>
    <div class="cause"><b>The cause</b><span id="why">You asked this website for something it does not hand out.</span><code id="what"></code></div>
    <a class="btn" href="/">Go to the website</a>
    <small>Nothing was broken or taken. Belgo keeps no passwords, admin pages or databases here.</small>
  </div>
</main>
<script>
(function () {
  var causes = {
    xss: 'You put script code in the address to make this site run it (cross-site scripting).',
    sql: 'You put database commands in the address (SQL injection). There is no database here.',
    climb: 'You tried to climb out of the website\'s folder to reach files on the server.',
    secret: 'You asked for a private file that websites keep hidden, such as passwords or backups.',
    admin: 'You went looking for an admin login page. Belgo has none.',
    script: 'You tried to run a server script. This site has no such scripts.'
  };
  var q = new URLSearchParams(location.search), why = causes[q.get('why')];
  if (why) document.getElementById('why').textContent = why;
  var what = (q.get('what') || '').slice(0, 120);
  if (what) document.getElementById('what').textContent = 'What gave you away: ' + what;
})();
</script>
</body>
</html>
